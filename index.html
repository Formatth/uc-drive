<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131a">
  <meta name="description" content="Periksa akses unduhan resmi untuk tautan UC Drive.">
  <title>UC Drive Downloader</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #10131a; color: #f4f6fb;
      font: 16px/1.6 system-ui, sans-serif;
    }
    main {
      width: min(100%, 520px); padding: 28px; background: #191e29;
      border: 1px solid #30394a; border-radius: 20px;
    }
    h1 { margin: 0 0 8px; font-size: 27px; }
    p { color: #b7c0d0; }
    input, button {
      width: 100%; padding: 13px 15px; border-radius: 10px; font: inherit;
    }
    input {
      color: white; background: #10131a; border: 1px solid #3b465a;
      margin: 8px 0 12px;
    }
    button {
      display: block; text-align: center; cursor: pointer;
      background: #b7f36b; color: #17200e; font-weight: 700; border: 0;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .result {
      margin-top: 20px; padding: 15px; border-radius: 12px;
      background: #10131a; overflow-wrap: anywhere;
    }
    .result a { display: block; margin-top: 12px; color: #b7f36b; }
    .small { font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>UC Drive Downloader</h1>
    <p>Periksa apakah tautan UC Drive menyediakan URL unduhan yang dapat dibuka lewat browser.</p>
    <form id="form">
      <label for="url">Link UC Drive</label>
      <input id="url" type="url" required maxlength="2048"
        placeholder="https://drive.ucweb.com/s/..."
        value="https://drive.ucweb.com/s/cea9c2ebe5944">
      <button id="submit" type="submit">Periksa Link</button>
    </form>
    <section id="result" class="result" aria-live="polite" hidden></section>
    <p class="small">Alat ini tidak melewati login atau proteksi akses. Unduhan bergantung pada dukungan resmi UC Drive.</p>
  </main>
  <script>
    const form = document.querySelector("#form");
    const input = document.querySelector("#url");
    const button = document.querySelector("#submit");
    const result = document.querySelector("#result");

    function addText(parent, tag, text) {
      const element = document.createElement(tag);
      element.textContent = text;
      parent.appendChild(element);
      return element;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.replaceChildren();
      result.hidden = false;
      button.disabled = true;
      button.textContent = "Memeriksa...";

      try {
        const response = await fetch("/api/inspect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: input.value.trim() })
        });
        const data = await response.json();
        if (!response.ok || !data.ok) {
          throw new Error(data.message || "Pemeriksaan gagal.");
        }

        addText(result, "strong", data.title || "Hasil pemeriksaan");
        addText(result, "p", data.message);

        if (data.mode === "download-link" && data.downloadUrl) {
          const link = document.createElement("a");
          link.href = data.downloadUrl;
          link.textContent = "Buka tautan unduhan resmi";
          link.rel = "noopener noreferrer";
          link.target = "_blank";
          result.appendChild(link);
        }

        const official = document.createElement("a");
        official.href = data.shareUrl;
        official.textContent = "Buka halaman UC Drive";
        official.rel = "noopener noreferrer";
        official.target = "_blank";
        result.appendChild(official);
      } catch (error) {
        addText(result, "p", error.message || "Terjadi kesalahan saat memeriksa link.");
      } finally {
        button.disabled = false;
        button.textContent = "Periksa Link";
      }
    });
  </script>
</body>
</html>
